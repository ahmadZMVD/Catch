name: Release Multi-ABI APKs

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > my-upload-key.jks
          fi
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
          fi

      - name: Run unit and Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Assemble multi-ABI Release APKs
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Stage multi-ABI Release APKs and SHA-256 checksums
        id: stage
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION_TAG="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_TAG}" ]; then
            VERSION_TAG="${INPUT_TAG}"
          else
            VERSION_TAG="v1.0.0"
          fi
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"

          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64 x86 universal; do
            src_apk=$(find app/build/outputs/apk/release -maxdepth 1 -name "*${abi}*.apk" | head -n 1)
            if [ -z "$src_apk" ]; then
              echo "Missing release APK for ABI: ${abi}"
              exit 1
            fi
            cp "$src_apk" "dist/Catch-${VERSION_TAG}-${abi}.apk"
          done

          (cd dist && sha256sum Catch-*.apk > SHA256SUMS.txt)
          ls -lh dist/
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stage.outputs.version_tag }}
          name: "Catch ${{ steps.stage.outputs.version_tag }}"
          generate_release_notes: true
          prerelease: false
          files: |
            dist/Catch-*.apk
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
