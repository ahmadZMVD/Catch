name: Android CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Verify Multi-ABI APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare signing keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
          fi

      - name: Run unit and Robolectric test suite
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Assemble multi-ABI Debug and Release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Verify multi-ABI Release APK outputs
        run: |
          ls -lh app/build/outputs/apk/release/
          for abi in arm64-v8a armeabi-v7a x86_64 x86 universal; do
            found=$(find app/build/outputs/apk/release -name "*${abi}*.apk" | head -n 1)
            if [ -z "$found" ]; then
              echo "Missing expected APK for ABI: $abi"
              exit 1
            fi
          done

      - name: Upload Multi-ABI Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: catch-release-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
